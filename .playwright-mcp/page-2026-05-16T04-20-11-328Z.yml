        - text: 周六上午，从梁博的沉吟一下子跳到林子祥——你知道吗，这个人唱歌从来不藏力气，他的声音像一整面墙的阳光直接照进来。这首歌简单到不行，就是一个男人说我每分每秒都需要你，没有修辞，没有铺垫，就是那么直。有时候最笨的情话反而最动人。 分分钟需要你。
